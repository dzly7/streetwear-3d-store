<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <!-- Liquid Chrome Gradients -->
    <linearGradient id="chrome-surface" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#e2e8f0" />
      <stop offset="48%" stop-color="#94a3b8" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="52%" stop-color="#475569" />
      <stop offset="75%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <linearGradient id="chrome-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <!-- Bevel & Shadow Filter -->
    <filter id="heavy-chrome" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000000" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#38bdf8" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Arch Curved Group -->
  <g filter="url(#heavy-chrome)" transform="translate(400, 110)">
    
    <!-- Outer Chrome Bevel Silhouette -->
    <path d="M -340 -10 C -200 -70 200 -70 340 -10 C 370 20 330 65 300 50 C 180 10 -180 10 -300 50 C -330 65 -370 20 -340 -10 Z" 
          fill="url(#chrome-rim)" stroke="#ffffff" stroke-width="4" opacity="0.6"/>

    <!-- Central Stylized Text Elements (SYNICAL) with Gothic & Cyber Spikes -->
    <!-- S -->
    <path d="M -290 -25 C -250 -45 -220 -30 -225 0 C -230 30 -280 20 -280 50 C -280 75 -240 75 -220 50 L -215 65 C -245 95 -300 90 -300 50 C -300 10 -245 25 -245 -5 C -245 -25 -275 -25 -290 -10 Z" 
          fill="url(#chrome-surface)" stroke="#ffffff" stroke-width="3"/>

    <!-- Y -->
    <path d="M -195 -30 L -165 20 L -135 -30 L -115 -30 L -155 35 L -155 75 L -175 75 L -175 35 L -215 -30 Z" 
          fill="url(#chrome-surface)" stroke="#ffffff" stroke-width="3"/>

    <!-- N -->
    <path d="M -100 -30 L -80 -30 L -30 45 L -30 -30 L -10 -30 L -10 75 L -30 75 L -80 0 L -80 75 L -100 75 Z" 
          fill="url(#chrome-surface)" stroke="#ffffff" stroke-width="3"/>

    <!-- I -->
    <path d="M 5 -30 L 25 -30 L 25 75 L 5 75 Z" 
          fill="url(#chrome-surface)" stroke="#ffffff" stroke-width="3"/>

    <!-- C -->
    <path d="M 120 -15 C 100 -35 55 -30 55 20 C 55 70 100 75 120 55 L 132 70 C 105 95 35 90 35 20 C 35 -50 105 -55 132 -30 Z" 
          fill="url(#chrome-surface)" stroke="#ffffff" stroke-width="3"/>

    <!-- A -->
    <path d="M 145 75 L 185 -35 L 205 -35 L 245 75 L 225 75 L 215 45 L 175 45 L 165 75 Z M 182 25 L 208 25 L 195 -12 Z" 
          fill="url(#chrome-surface)" stroke="#ffffff" stroke-width="3"/>

    <!-- L -->
    <path d="M 260 -35 L 280 -35 L 280 55 L 325 55 L 325 75 L 260 75 Z" 
          fill="url(#chrome-surface)" stroke="#ffffff" stroke-width="3"/>

    <!-- Cyberpunk Star / Cross Highlights on Center -->
    <polygon points="0,-45 4,-20 28,-16 4,-12 0,12 -4,-12 -28,-16 -4,-20" fill="#ffffff" filter="drop-shadow(0 0 6px #ffffff)"/>
    <polygon points="-260,-40 -258,-28 -246,-26 -258,-24 -260,-12 -262,-24 -274,-26 -262,-28" fill="#ffffff" filter="drop-shadow(0 0 4px #ffffff)"/>
    <polygon points="280,-40 282,-28 294,-26 282,-24 280,-12 278,-24 266,-26 278,-28" fill="#ffffff" filter="drop-shadow(0 0 4px #ffffff)"/>
  </g>
</svg>
